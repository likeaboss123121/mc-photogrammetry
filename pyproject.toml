[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mc-photogrammetry"
version = "0.1.0"
description = "Recover Minecraft block structures from images and video."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nbtlib>=2.0",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "Pillow>=11.0",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.8",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
]
gpu = [
    "wgpu>=0.20",
]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
mc-photogrammetry = "mc_photogrammetry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_photogrammetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
